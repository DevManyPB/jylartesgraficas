packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # Todas transitivas de firebase / firebase-admin / vitest.
  '@firebase/util': true
  esbuild: true
  protobufjs: true
  # Dependencia transitiva de eslint-config-next (vía eslint-import-resolver-typescript).
  # Su postinstall compila/descarga un binario nativo de resolución de módulos.
  unrs-resolver: true
